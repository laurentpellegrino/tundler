name: Update VeePN configs

# VeePN's dashboard + API sit behind a Cloudflare JS challenge, so the
# config archive can't be fetched with curl (it 403s). This workflow
# drives Chrome with Botasaurus (headed, under xvfb) to clear the challenge, log
# in, and download "all configuration files", then republishes the
# `veepn-configs` release that docker/providers/veepn/install.sh bakes.
#
# Auth: the VeePN ACCOUNT login (email + password — NOT the per-pod
# manual-config credentials at vpn/veepn/pod-<n>) lives in OpenBao at
# kv/vpn/veepn (`username` / `password`), in the fleet operator's
# namespace. vault-action exchanges this workflow's GitHub OIDC token
# for a short-lived OpenBao token via the `tundler` role, bound to this
# repo's main branch so forks and PR runs can't obtain it; the role's
# policy grants read on that single path only. The namespace name is
# supplied by the repo secret OPENBAO_VPN_NAMESPACE rather than spelled
# out here. Role + policy are managed by
# elaunira-openbao/scripts/configure-github-jwt.sh (SCOPED_ROLES).
#
# Botasaurus handles the dashboard's browser challenge.
# WARP also avoids direct GitHub runner egress, as in the IPVanish updater.
on:
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * *'   # 05:40 UTC, before docker-image.yml's 07:00 rebuild

permissions:
  contents: write   # create/upload the veepn-configs release
  id-token: write   # for vault-action JWT auth

concurrency:
  cancel-in-progress: false
  group: update-veepn-configs

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: veepn-configs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Botasaurus driver + xvfb
        run: |
          set -euo pipefail
          pip install -r scripts/requirements-veepn.txt
          sudo apt-get update && sudo apt-get install -y xvfb
          # Google Chrome is preinstalled on GitHub's Ubuntu runner image.
          google-chrome --version

      - name: Test archive validation
        run: python -m unittest discover -s scripts -p 'test_veepn_configs.py' -v

      - name: Setup Cloudflare WARP
        uses: ./.github/actions/setup-cloudflare-warp

      - name: Fetch VeePN account login from OpenBao
        uses: hashicorp/vault-action@v4
        with:
          url: https://bao.elaunira.com
          method: jwt
          path: github-actions
          role: tundler
          namespace: ${{ secrets.OPENBAO_VPN_NAMESPACE }}
          jwtGithubAudience: https://github.com/laurentpellegrino
          # Exported as env vars for the step below; vault-action masks them.
          secrets: |
            kv/data/vpn/veepn username | VEEPN_EMAIL ;
            kv/data/vpn/veepn password | VEEPN_PASSWORD

      - name: Download configs via Botasaurus + Chrome
        run: |
          set -euo pipefail
          if [ -z "${VEEPN_EMAIL:-}" ] || [ -z "${VEEPN_PASSWORD:-}" ]; then
            echo "::error::VeePN account login not received from OpenBao (kv/vpn/veepn username/password)."
            exit 1
          fi
          xvfb-run -a python scripts/update-veepn-configs.py --out /tmp/veepn-configs.zip

      - name: Skip when checksum matches current release
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release download "$RELEASE_TAG" --pattern veepn-configs.zip --dir /tmp/current 2>/dev/null; then
            # Normalize legacy assets too; upstream ZIP timestamps/order may vary.
            python scripts/update-veepn-configs.py \
              --from-zip /tmp/current/veepn-configs.zip --out /tmp/current/normalized.zip
            if [ "$(sha256sum /tmp/veepn-configs.zip | cut -d ' ' -f1)" = "$(sha256sum /tmp/current/normalized.zip | cut -d ' ' -f1)" ]; then
              echo "Configs unchanged (content sha256 match); nothing to publish."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "Configs changed."
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No existing release asset yet; publishing initial."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "VeePN OpenVPN configs (account dashboard mirror)" \
                --notes "All-locations OpenVPN config archive from VeePN's 'download all configs', fetched via Botasaurus + Chrome. See update-veepn-configs.yml."
          gh release upload "$RELEASE_TAG" /tmp/veepn-configs.zip --clobber --repo "$GITHUB_REPOSITORY"
          echo "::notice::Refreshed ${RELEASE_TAG} veepn-configs.zip"
